<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Опрос по тревожности</title>
    <meta
      name="description"
      content="Опрос для определения преобладающего типа тревожности."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background" aria-hidden="true">
      <span class="orb orb-1"></span>
      <span class="orb orb-2"></span>
      <span class="orb orb-3"></span>
      <span class="grid"></span>
    </div>

    <header class="site-header container">
      <a class="brand" href="index.html">Ментальное здоровье</a>
      <nav class="nav">
        <a href="index.html">Главная</a>
        <a href="#survey-form">Вопросы</a>
      </nav>
    </header>

    <main class="container survey-layout">
      <section class="survey-intro glass-panel reveal">
        <p class="eyebrow">Диагностика состояния</p>
        <h1>Опрос по преобладающему типу тревожности</h1>
      </section>

      <section class="survey-content reveal">
        <form id="survey-form" class="glass-panel survey-form">
          <div class="survey-hint">
            <div class="hint-badge">1–6</div>
            <p>Ситуативная тревожность</p>
            <div class="hint-badge">7–12</div>
            <p>Личностная тревожность</p>
          </div>

          <div id="questions" class="question-list"></div>

          <noscript>
            <p class="noscript-note">
              Чтобы пройти опрос и увидеть результат, включите JavaScript в браузере.
            </p>
          </noscript>

          <button type="submit" class="button primary large-button">
            Показать результат
          </button>
        </form>

        <section id="results" class="glass-panel results hidden" aria-live="polite">
          <div class="results-header">
            <p class="eyebrow">Результаты</p>
            <h2>Ваш профиль тревожности</h2>
          </div>
          <div class="score-grid">
            <article>
              <span>Ситуативная тревожность</span>
              <strong id="state-score">0</strong>
            </article>
            <article>
              <span>Личностная тревожность</span>
              <strong id="trait-score">0</strong>
            </article>
          </div>
          <div id="result-summary" class="result-summary"></div>
          <div id="recommendations" class="recommendations"></div>
        </section>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
